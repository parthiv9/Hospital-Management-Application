# =============== Spring Boot Config ====================
server.port=9090

# =============== Application Info ======================
info.name=Patient Management System

# =============== H2 Console (Optional) =================
spring.h2.console.enabled=true

# =============== MySQL - Local Database ===============
spring.datasource.url=jdbc:mysql://localhost:3306/app?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Admin@123

# =============== MySQL - Remote (phpMyAdmin) ==========
# To use remote DB, comment out the local config above and uncomment these
# spring.datasource.url=jdbc:mysql://sql12.freemysqlhosting.net:3306/sql12309878?useSSL=false&serverTimezone=UTC
# spring.datasource.username=sql12309878
# spring.datasource.password=n3NeyGhIg9

# =============== Hibernate / JPA Settings =============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
